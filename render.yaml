services:
  - type: web
    name: xdownderbackend-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT main:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: NDUS
        value: YuLuQdPpeHuiMGEQDXpWDu6K2P4-xInj8YGEzswD
      # Optional: paste your cookies.txt content into COOKIES_DATA in Render dashboard
      # - key: COOKIES_DATA
      #   sync: false
